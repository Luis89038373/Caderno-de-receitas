<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receita | Caderno de Receitas</title><link rel="stylesheet" href="assets/css/styles.css?v=12-20260818"><script defer src="assets/js/app.js?v=12-20260818"></script></head><body><div id="site-nav"></div><main id="main"><div class="container empty">Carregando receita...</div></main><div id="site-footer"></div>
<script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),recipes=await loadJSON('data/recipes.json'),r=recipes.find(x=>x.id===id);if(!r){$('#main').innerHTML='<div class="container empty"><h2>Receita não encontrada</h2><a class="btn" href="index.html">Voltar ao catálogo</a></div>';return;}document.title=`${r.id} — ${r.titulo}`;const sourceLink=r.imagem&&r.imagem.fonte&&/^https?:/.test(r.imagem.fonte)?`<a href="${safe(r.imagem.fonte)}" target="_blank" rel="noopener noreferrer">Fonte da imagem ↗</a>`:'';const prep=(r.preparo&&r.preparo.length)?`<div class="steps">${r.preparo.map(s=>`<div class="step"><div>${safe(s)}</div></div>`).join('')}</div>`:`<div class="notice"><strong>Modo de preparo não registrado:</strong> a fonte disponível não apresenta etapas suficientes para uma transcrição fiel. Nenhuma etapa foi inventada.</div>`;const review=r.status!=='publicada'?`<div class="notice"><strong>Em revisão:</strong> existe pelo menos um trecho, medida ou anotação que precisa ser conferido no original.</div>`:'';const tips=(r.dicas||[]).filter(Boolean);$('#main').innerHTML=`<section class="recipe-hero"><div class="container recipe-cover"><div class="recipe-image"><img src="${safe(versionedURL(r.imagem.url))}" alt="${safe(r.titulo)}" onerror="this.style.display='none'"></div><div class="recipe-intro"><button class="btn secondary recipe-back" type="button" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">← Voltar</button><div class="meta"><span class="badge">${safe(r.id)}</span><span class="badge">${safe(r.categoria)}</span><span class="badge">${statusLabel(r.status)}</span></div><h1>${safe(r.titulo)}</h1>${r.data_original?`<div class="meta">Data original: ${safe(r.data_original)}</div>`:''}<p>${safe(r.contexto)}</p><div class="source-note"><strong>${safe(r.imagem.credito||'Imagem relacionada à receita')}</strong><br>${safe(r.imagem.observacao||'')} ${sourceLink}</div></div></div></section><section class="section"><div class="container recipe-layout"><div><div class="panel"><span class="eyebrow">Mise en place</span><h2>Ingredientes</h2><ul class="ingredient-list">${r.ingredientes.map(i=>`<li><span class="qty">${safe(i.quantidade)}</span><span>${safe(i.item)}</span></li>`).join('')}</ul></div></div><div><div class="panel"><span class="eyebrow">Passo a passo</span><h2>Modo de preparo</h2>${prep}</div><div class="panel" style="margin-top:28px"><span class="eyebrow">Anotações</span><h2>Observações</h2>${tips.length?`<ul>${tips.map(d=>`<li>${safe(d)}</li>`).join('')}</ul>`:'<p>Sem observações adicionais registradas.</p>'}${review}</div></div></div></section>`;});</script></body></html>
